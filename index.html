<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 Things I Like About You 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1e0f33; --pink:#ff7eb6; --lav:#a98bff; --sky:#6cc8f5; --mint:#7ee0a8; --lemon:#ffe66b; --peach:#ff9f7a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:'Gaegu','Fredoka',cursive; font-size:22px; color:var(--ink);
  background:
    radial-gradient(circle at 20% 10%, #fff 0 2px, transparent 3px) 0 0/60px 60px,
    linear-gradient(180deg,#7a2f9e 0%,#4b2a8a 50%,#2a3f8f 100%);
  background-attachment:fixed; overflow-x:hidden;
  padding:0 16px 60px;
}
/* intro overlay */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#7a2f9e,#2a3f8f);color:#fff3fa;text-align:center;padding:20px}
#intro h2{font-family:'Fredoka';font-size:clamp(30px,8vw,54px);margin:10px 0}
#intro p{margin:0 0 22px;font-size:24px}
.btn{font-family:'Fredoka';font-weight:700;font-size:20px;color:var(--ink);background:var(--lemon);
  border:3px solid var(--ink);border-radius:999px;padding:12px 28px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);
  transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.big{font-size:70px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}
/* header */
header{text-align:center;padding:50px 0 20px}
.sticker{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 18px;
  font-family:'Fredoka';font-weight:600;font-size:16px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg)}
h1{font-family:'Fredoka';font-weight:700;font-size:clamp(34px,9vw,68px);line-height:1.05;margin:16px 0 8px;
  color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
header p{margin:0;font-size:24px;color:#fff3fa}
footer{color:#fff3fa}
/* layout */
main{max-width:640px;margin:0 auto}
.block{margin:46px 0}
.polaroid{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 12px 8px;width:min(78%,300px);
  box-shadow:6px 6px 0 var(--ink);position:relative;margin:0 auto -26px;z-index:2;text-align:center}
.polaroid:nth-child(odd){}
.block:nth-child(odd) .polaroid{transform:rotate(-4deg);margin-left:6%}
.block:nth-child(even) .polaroid{transform:rotate(4deg);margin-right:6%}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border:2px solid var(--ink);border-radius:8px;background:var(--lemon)}
.polaroid .ph{width:100%;aspect-ratio:4/5;border:2px dashed var(--ink);border-radius:8px;display:flex;align-items:center;
  justify-content:center;flex-direction:column;background:var(--lemon);font-family:'Fredoka';font-size:15px}
.polaroid .ph b{font-size:44px}
.polaroid::before{content:"";position:absolute;top:-14px;left:50%;width:80px;height:26px;transform:translateX(-50%) rotate(-3deg);
  background:rgba(255,158,199,.8);border:2px solid var(--ink);border-radius:4px}
.polaroid span.cap{font-family:'Gaegu';font-weight:700;font-size:20px;display:block;margin-top:6px}
.box{border:3px solid var(--ink);border-radius:26px;padding:48px 26px 26px;box-shadow:8px 8px 0 var(--ink);line-height:1.5;position:relative}
.box p{margin:0}
.c0{background:var(--pink)} .c1{background:var(--sky)} .c2{background:var(--lemon)} .c3{background:var(--mint)}
.c4{background:var(--lav)} .c5{background:var(--peach)} .c6{background:#ff9ccf} .c7{background:var(--lemon)}
.box::after{content:"✦";position:absolute;right:14px;bottom:8px;font-size:26px;color:#fff;-webkit-text-stroke:1.5px var(--ink)}
.final{text-align:center}
.final h3{font-family:'Fredoka';font-size:clamp(26px,6.5vw,38px);margin:14px 0 20px}
.btns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;min-height:70px;position:relative}
#yes{background:#fff;font-size:22px}
#no{background:var(--sky)}
#thanks{display:none;font-family:'Fredoka';font-size:26px;margin-top:20px}
footer{text-align:center;margin-top:50px;font-family:'Fredoka';font-size:16px}
/* music button */
#music{position:fixed;right:14px;top:14px;z-index:40;font-size:24px;width:52px;height:52px;border-radius:50%;
  border:3px solid var(--ink);background:var(--lemon);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
#music.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* floaty bits */
.float{position:fixed;pointer-events:none;z-index:0;opacity:.7;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
main,header,footer{position:relative;z-index:1}
body{position:relative}
#decor{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:0}
#decor svg{position:absolute;transform:rotate(var(--r,0deg));animation:sway 5s ease-in-out infinite;
  filter:drop-shadow(3px 3px 0 rgba(59,31,74,.25))}
@keyframes sway{50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 8deg))}}
</style>
</head>
<body>

<div id="intro">
  <div class="big">💌</div>
  <h2>hey you ✦</h2>
  <p>i made you something. tap to open it (sound on!) 🎧</p>
  <button class="btn" id="open">open me ♡</button>
</div>

<div id="decor"></div>

<button id="music" title="music on/off">🎵</button>
<audio id="bg" src="song.mp3" loop preload="auto"></audio>

<header>
  <div class="sticker">★ a memoir for a very important day ★</div>
  <h1>10 Things<br>I Like<br>About You</h1>
  <p>(okay it’s more than ten. i lost count.) ✿</p>
</header>

<main id="letter"></main>

<footer>made with ♡ &nbsp;·&nbsp; scroll back up anytime ✦</footer>

<script>
/* ===== EDIT HERE ===== */
// Photos go in the "images" folder and must be named pic1.jpg ... pic8.jpg
// Tiny captions under each photo (change or leave empty)
const captions = ["us ✿","that smile","chaos queen","coffee date?","rainy fest","the eyes 👀","my fav human","you + me ♡"];
/* ===================== */

const blocks = [
`Can I tell you something?
I think we had a pretty weird start, didn’t we?
I disappeared for three weeks.
And honestly, I wish I could say I had some very complicated reason for it.
But the truth is,
I was scared.
Scared of admitting that I was beginning to like someone.
Scared of being a little too honest with myself.
And somehow, ignoring you felt easier than figuring out what I was feeling.
Funny how that worked out.`,

`Because here I am, trying to find the right words to tell you
something I probably should have said much earlier.
I’ve had my fair share of experiences
that have taught me to keep certain parts of myself guarded.
To think twice before getting attached.
To not get too excited.
To always have one foot out the door, just in case.
But with you, something feels different.
I don’t feel like I have to put on a version of myself
that is easier to like.
I can be stupid.
I can ramble.
I can say the most random things.
I can just be me.

And I think that’s also because of you.`,

`Because, have you looked at yourself?

You’re genuinely one of the prettiest people I’ve ever seen.
And I’m not just talking about how you look.
Although, those eyes of yours definitely deserve a separate conversation.

There’s something about the way you look at things,
the expressions you make,
the way your face gives away approximately seventeen different emotions
before you even say a word.`,

`And you’re crazy.
Like, genuinely crazy.
But in the most adorable way possible.

Your nakhre,
your attitude,
the little arguments over absolutely nothing,
the way you sometimes act like you have the final say in everything.

And somehow, I find all of it ridiculously endearing.

I like how you can be so stubborn about the smallest things
and then be the sweetest person five minutes later.`,

`I like your little quirks,
your random conversations,
and all those tiny things that you probably don’t even realise I notice.

And I think that’s what I want you to understand.

I don’t just like the idea of taking you out.
I like the person I’d be taking out.

The girl I’d get coffee with at Tan Coffee.
The girl I’d stand around with at a college fest in the middle of the rain,
even when the concert is a complete mess.

The girl who somehow manages to make me forget
that I’m supposed to be acting normal around my friends.`,

`And yes, I am aware that you posted me.
And yes, I was probably way too happy about it.

But I guess that’s the thing.

I like being around you.
I like looking at you.
I like listening to you.
And I like that even after we’ve spent hours together,
I still find myself wishing we had a little more time.`,

`I don’t know exactly what the future looks like,
and I don’t think either of us needs to figure that out right now.

I just know that I’d like to be a little more than someone
you make random plans with.

I’d like to take you on dates.
I’d like to make more memories with you.
I’d like to get to know the parts of you
that I haven’t had the chance to yet.`,

`And if you’re not ready for that right now,
I genuinely don’t want you to feel pressured.
I’d rather you be honest with me
than say yes because you think you have to.

But I also owe it to myself to be honest about this.

I like you.
And I think I’d really like to give this a proper chance.`
];

const root = document.getElementById('letter');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

blocks.forEach((t,i)=>{
  const last = i === blocks.length-1;
  const n = i+1;
  root.insertAdjacentHTML('beforeend', `
  <section class="block">
    <div class="polaroid">
      <img src="images/pic${n}.jpg" alt="photo ${n}" onerror="this.outerHTML='<div class=ph><b>📸</b>add images/pic${n}.jpg</div>'">
      <span class="cap">${esc(captions[i]||'')}</span>
    </div>
    <div class="box c${i} ${last?'final':''}">
      <p>${esc(t).replace(/\n/g,'<br>')}</p>
      ${last?`
      <h3>So, what do you say?<br>Would you let me take you out?<br>Properly, this time. ♡</h3>
      <div class="btns">
        <button class="btn" id="yes">YES 💖</button>
        <button class="btn" id="no">no</button>
      </div>
      <div id="thanks">YAYYY!! 🎀✨ screenshot this &amp; text me right now 😭</div>`:''}
    </div>
  </section>`);
});

/* music */
const audio = document.getElementById('bg'), mbtn = document.getElementById('music');
function setPlaying(p){ mbtn.classList.toggle('spin',p); mbtn.textContent = p ? '🎵' : '🔇'; }
document.getElementById('open').onclick = () => {
  document.getElementById('intro').style.display='none';
  audio.volume = 0.6;
  audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false));
};
mbtn.onclick = () => { if(audio.paused){audio.play();setPlaying(true)}else{audio.pause();setPlaying(false)} };

/* background cartoon stickers */
const S = 'stroke="#3b1f4a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
const wrap = inner => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const stickers = [
  wrap(`<path d="M28 74a18 18 0 0 1-2-34 24 24 0 0 1 46-6 20 20 0 0 1 4 40z" fill="#fff" ${S}/>`),
  wrap(`<path d="M50 4C54 34 66 46 96 50 66 54 54 66 50 96 46 66 34 54 4 50 34 46 46 34 50 4z" fill="#fff3a3" ${S}/>`),
  wrap(`<path d="M50 88C10 58 4 32 24 18 38 8 50 20 50 28 50 20 62 8 76 18 96 32 90 58 50 88z" fill="#ff9ec7" ${S}/><path d="M28 30q4-8 12-8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`),
  wrap(`<g fill="#ffb3d9" ${S}><circle cx="50" cy="24" r="18"/><circle cx="76" cy="43" r="18"/><circle cx="66" cy="73" r="18"/><circle cx="34" cy="73" r="18"/><circle cx="24" cy="43" r="18"/></g><circle cx="50" cy="52" r="13" fill="#fff3a3" ${S}/>`),
  wrap(`<circle cx="50" cy="50" r="42" fill="#fff3a3" ${S}/><circle cx="36" cy="42" r="5" fill="#3b1f4a"/><circle cx="64" cy="42" r="5" fill="#3b1f4a"/><path d="M30 60q20 22 40 0" fill="none" stroke="#3b1f4a" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="58" r="6" fill="#ff9ec7" opacity=".8"/><circle cx="76" cy="58" r="6" fill="#ff9ec7" opacity=".8"/>`),
  wrap(`<g fill="#c9b6ff" ${S}><ellipse cx="28" cy="34" rx="22" ry="26" transform="rotate(-20 28 34)"/><ellipse cx="72" cy="34" rx="22" ry="26" transform="rotate(20 72 34)"/><ellipse cx="32" cy="70" rx="14" ry="18" transform="rotate(20 32 70)"/><ellipse cx="68" cy="70" rx="14" ry="18" transform="rotate(-20 68 70)"/></g><rect x="46" y="28" width="8" height="52" rx="4" fill="#3b1f4a"/><circle cx="30" cy="32" r="6" fill="#fff"/><circle cx="70" cy="32" r="6" fill="#fff"/>`),
  wrap(`<circle cx="50" cy="50" r="44" fill="#a8e1ff" ${S}/><circle cx="50" cy="50" r="26" fill="#ffd6ec" stroke="#3b1f4a" stroke-width="3"/><circle cx="50" cy="50" r="10" fill="#fff" ${S}/><path d="M22 34q10-16 28-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`),
  wrap(`<path d="M50 50L8 22V78z" fill="#ff9ec7" ${S}/><path d="M50 50L92 22V78z" fill="#ff9ec7" ${S}/><circle cx="50" cy="50" r="11" fill="#fff3a3" ${S}/>`),
  wrap(`<path d="M58 4L18 56H46L38 96 82 40H54z" fill="#fff3a3" ${S}/>`),
  wrap(`<path d="M50 6l12 28 30 3-23 20 7 30-26-16-26 16 7-30L8 37l30-3z" fill="#b8f2d0" ${S}/>`)
];
function buildDecor(){
  const d = document.getElementById('decor');
  d.innerHTML = '';
  const H = document.documentElement.scrollHeight;
  d.style.height = H + 'px';
  const n = Math.max(14, Math.round(H / 170));
  for(let i=0;i<n;i++){
    const wrapEl = document.createElement('div');
    wrapEl.innerHTML = stickers[(i*3+Math.floor(i/10)) % stickers.length];
    const svg = wrapEl.firstChild;
    const size = 44 + Math.random()*56;
    svg.style.width = svg.style.height = size + 'px';
    svg.style.top = (i/n*H + Math.random()*80) + 'px';
    const left = i % 2 === 0;
    const off = (Math.random()*9 - 2) + '%';
    if(left) svg.style.left = off; else svg.style.right = off;
    svg.style.setProperty('--r', (Math.random()*50-25) + 'deg');
    svg.style.animationDelay = (-Math.random()*5) + 's';
    svg.style.animationDuration = (4+Math.random()*3) + 's';
    d.appendChild(svg);
  }
}
window.addEventListener('load', () => { buildDecor(); setTimeout(buildDecor, 1200); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(buildDecor, 300); });

/* floating y2k bits */
const bits = ['✦','♡','★','✿','☁','✧','💖','🎀'];
for(let i=0;i<16;i++){
  const f = document.createElement('div');
  f.className='float'; f.textContent = bits[i%bits.length];
  f.style.left = Math.random()*100+'vw';
  f.style.fontSize = (16+Math.random()*26)+'px';
  f.style.animationDuration = (14+Math.random()*16)+'s';
  f.style.animationDelay = (-Math.random()*20)+'s';
  document.body.appendChild(f);
}

/* the question */
const no = document.getElementById('no'), yes = document.getElementById('yes');
function dodge(){
  no.style.position='relative';
  no.style.left = (Math.random()*160-80)+'px';
  no.style.top = (Math.random()*80-40)+'px';
}
no.addEventListener('mouseover',dodge);
no.addEventListener('touchstart',e=>{e.preventDefault();dodge()});
no.addEventListener('click',dodge);
yes.onclick = () => {
  document.getElementById('thanks').style.display='block';
  no.style.display='none';
  for(let i=0;i<40;i++){
    const h = document.createElement('div');
    h.className='float'; h.textContent = bits[i%bits.length];
    h.style.left = Math.random()*100+'vw';
    h.style.fontSize = (22+Math.random()*30)+'px';
    h.style.opacity = 1; h.style.zIndex = 60;
    h.style.animationDuration = (3+Math.random()*3)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6500);
  }
};
</script>
</body>
</html>
